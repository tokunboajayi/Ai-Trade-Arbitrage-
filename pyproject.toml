[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hedge-fund-bot"
version = "0.1.0"
description = "Multi-agent AI hedge fund trading system"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    
    # Async
    "aiohttp>=3.9",
    "aiofiles>=23.0",
    "apscheduler>=3.10",
    
    # Database
    "aiosqlite>=0.19",
    
    # Market connectors
    "websockets>=12.0",
    "httpx>=0.27",
    
    # Solana
    "solana>=0.34",
    "solders>=0.21",
    "base58>=2.1",
    
    # Crypto
    "cryptography>=42.0",
    
    # Notifications
    "python-telegram-bot>=21.0",
    
    # Utilities
    "structlog>=24.0",
    "rich>=13.0",
    "tenacity>=8.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
hedge-fund = "src.core.orchestrator:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
